<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1024">
    <title>Admin - User Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0c0c27; color: white; font-family: 'Poppins', sans-serif; padding: 20px; min-width: 1024px; }
        .card { background-color: #1c1c3a; border: 1px solid #2a2a4a; color: white; border-radius: 15px; }
        .user-row { border-bottom: 1px solid #2a2a4a; transition: 0.3s; }
        .user-row:hover { background: rgba(255,255,255,0.05); }
        .user-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid #facc15; }
        .status-badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 20px; }
        .btn-ban { background: #f94879; border: none; color: white; margin-right: 5px; }
        .btn-unban { background: #2ecc71; border: none; color: white; margin-right: 5px; }
        .btn-delete { background: #dc3545; border: none; color: white; }
        .wallet-input { width: 80px; background: #0c0c27; border: 1px solid #facc15; color: white; border-radius: 5px; text-align: center; }
        .search-bar { background: #1c1c3a; border: 1px solid #2a2a4a; color: white; border-radius: 50px; padding: 10px 20px; width: 100%; margin-bottom: 20px; }
        .stat-badge { font-size: 0.9rem; padding: 8px 15px; border-radius: 10px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .bg-deposit { background: #10b981; color: white; }
        .bg-withdraw { background: #f43f5e; color: white; }
        .clear-btn { cursor: pointer; font-size: 0.8rem; background: rgba(255,255,255,0.2); padding: 2px 6px; border-radius: 5px; transition: 0.3s; }
        .clear-btn:hover { background: white; color: black; }

        /* CUSTOM CONFIRM MODAL STYLING */
        #customModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .custom-modal-content {
            background: #1a1a3c;
            padding: 22px;
            border-radius: 14px;
            width: 90%;
            max-width: 330px;
            border: 1px solid #ff4c60;
            text-align: center;
            box-shadow: 0 0 25px rgba(255, 76, 96, 0.3);
        }
        .custom-modal-content h3 { margin-top: 0; color: #fff; font-size: 1.2rem; }
        .custom-modal-content p { color: #ccc; font-size: 14px; margin: 15px 0; }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .modal-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-cancel { background: #333; color: #fff; }
        .btn-danger-modal { background: #ff3333; color: #fff; }
    </style>
</head>
<body>

    <div class="container-fluid">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
            <h2><i class="fa-solid fa-users-gear text-warning"></i> User Management</h2>
            <div class="d-flex gap-2">
                <span class="badge bg-primary stat-badge">
                    <span id="totalUsers">Users: 0</span>
                </span>
                
                <span class="badge bg-deposit stat-badge">
                    <span id="totalDeposit">Deposit: RS 0</span>
                    <i class="fa-solid fa-trash-can clear-btn" onclick="clearStats('Deposit')" title="Clear Deposit View"></i>
                </span>

                <span class="badge bg-withdraw stat-badge">
                    <span id="totalWithdraw">Withdraw: RS 0</span>
                    <i class="fa-solid fa-trash-can clear-btn" onclick="clearStats('Withdraw')" title="Clear Withdraw View"></i>
                </span>
            </div>
        </div>

        <input type="text" id="userSearch" class="search-bar" placeholder="Search by name, email or phone...">

        <div class="card shadow">
            <div class="table-responsive p-3">
                <table class="table table-dark table-hover align-middle">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Contact Info</th>
                            <th>Wallet (RS)</th>
                            <th>History</th> <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr><td colspan="6" class="text-center text-secondary">Loading users...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- CUSTOM CONFIRM MODAL POPUP CONTAINER -->
    <div id="customModal">
        <div class="custom-modal-content">
            <h3 id="modalTitle">Confirmation</h3>
            <p id="modalText">Are you sure?</p>
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" onclick="closeConfirmModal()">Cancel</button>
                <button class="modal-btn btn-danger-modal" id="modalOkBtn">Confirm</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, remove, get } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyANjbQLKEpV0Mj5e5PJzCPZvFo8a5vzy_k",
            authDomain: "ff-tournamint-323ac.firebaseapp.com",
            databaseURL: "https://ff-tournamint-323ac-default-rtdb.firebaseio.com",
            projectId: "ff-tournamint-323ac",
            storageBucket: "ff-tournamint-323ac.firebasestorage.app",
            appId: "1:157085748163:web:848536d10ae58d32398b76"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const userTableBody = document.getElementById('userTableBody');

        // Custom Confirmation Modal Functions
        function showConfirm(title, text, callback) {
            document.getElementById("modalTitle").innerText = title;
            document.getElementById("modalText").innerText = text;
            const okBtn = document.getElementById("modalOkBtn");
            document.getElementById("customModal").style.display = "flex";
            
            okBtn.onclick = function() {
                closeConfirmModal();
                callback();
            };
        }

        window.closeConfirmModal = function() {
            document.getElementById("customModal").style.display = "none";
        };

        function fetchAllUserData() {
            const usersRef = ref(db, 'users');
            const depositsRef = ref(db, 'Requests/Deposits');
            const withdrawsRef = ref(db, 'Requests/Withdrawals');
            const statsRef = ref(db, 'AdminStats');

            onValue(usersRef, (userSnap) => {
                const users = userSnap.val() || {};
                const userKeys = Object.keys(users);
                document.getElementById('totalUsers').innerText = `Users: ${userKeys.length}`;

                if (userKeys.length === 0) {
                    userTableBody.innerHTML = "<tr><td colspan='6' class='text-center'>No users found</td></tr>";
                } else {
                    let rowsHtml = "";
                    userKeys.forEach(uid => {
                        const user = users[uid];
                        const isBanned = user.status === "Banned";

                        rowsHtml += `
                            <tr class="user-row">
                                <td>
                                    <div class="d-flex align-items-center">
                                        <img src="${user.profilePic || 'https://via.placeholder.com/50'}" class="user-img me-3">
                                        <div>
                                            <div class="fw-bold">${user.displayName || 'No Name'}</div>
                                            <small class="text-secondary">ID: ${uid.substring(0,8)}</small>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <small><i class="fa-solid fa-envelope text-info"></i> ${user.email}</small><br>
                                    <small><i class="fa-solid fa-phone text-success"></i> ${user.phone || 'N/A'}</small>
                                </td>
                                <td>
                                    <input type="number" class="wallet-input" value="${user.wallet || 0}" 
                                        onchange="updateWallet('${uid}', this.value)">
                                </td>
                                <td>
                                    <small class="text-success" id="in-${uid}">In: RS 0</small><br>
                                    <small class="text-danger" id="out-${uid}">Out: RS 0</small>
                                </td>
                                <td>
                                    <span class="status-badge ${isBanned ? 'bg-danger' : 'bg-success'}">
                                        ${isBanned ? 'Banned' : 'Active'}
                                    </span>
                                </td>
                                <td>
                                    <button class="btn btn-sm ${isBanned ? 'btn-unban' : 'btn-ban'}" 
                                        onclick="toggleBan('${uid}', '${user.status}')">
                                        <i class="fa-solid ${isBanned ? 'fa-user-check' : 'fa-user-slash'}"></i>
                                    </button>
                                    <button class="btn btn-sm btn-delete" onclick="deleteUser('${uid}')">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                    userTableBody.innerHTML = rowsHtml;
                }

                onValue(depositsRef, (depSnap) => {
                    onValue(withdrawsRef, (witSnap) => {
                        onValue(statsRef, (statSnap) => {
                            const allDeposits = depSnap.val() || {};
                            const allWithdrawals = witSnap.val() || {};
                            const offsets = statSnap.val() || { depositOffset: 0, withdrawOffset: 0 };

                            let totalDepositSum = 0;
                            let totalWithdrawSum = 0;

                            userKeys.forEach(uid => {
                                let userIn = 0;
                                let userOut = 0;

                                Object.values(allDeposits).forEach(d => {
                                    if (d.userId === uid && (d.status === "Success" || d.status === "Successful")) {
                                        userIn += parseFloat(d.amount || 0);
                                        totalDepositSum += parseFloat(d.amount || 0);
                                    }
                                });

                                Object.values(allWithdrawals).forEach(w => {
                                    if (w.userId === uid && (w.status === "Success" || w.status === "Successful")) {
                                        userOut += parseFloat(w.amount || 0);
                                        totalWithdrawSum += parseFloat(w.amount || 0);
                                    }
                                });

                                const inEl = document.getElementById(`in-${uid}`);
                                const outEl = document.getElementById(`out-${uid}`);
                                if (inEl) inEl.innerText = `In: RS ${userIn}`;
                                if (outEl) outEl.innerText = `Out: RS ${userOut}`;
                            });

                            let displayDep = totalDepositSum - (offsets.depositOffset || 0);
                            let displayWit = totalWithdrawSum - (offsets.withdrawOffset || 0);

                            document.getElementById('totalDeposit').innerText = `Deposit: RS ${displayDep <= 0 ? 0 : displayDep}`;
                            document.getElementById('totalWithdraw').innerText = `Withdraw: RS ${displayWit <= 0 ? 0 : displayWit}`;
                        });
                    });
                });
            });
        }

        window.clearStats = (type) => {
            showConfirm("Clear Stats", `Kya aap ${type} counter ko zero karna chahte hain?`, function() {
                const depositsRef = ref(db, 'Requests/Deposits');
                const withdrawsRef = ref(db, 'Requests/Withdrawals');
                const statsRef = ref(db, 'AdminStats');

                if(type === 'Deposit') {
                    get(depositsRef).then(snap => {
                        let currentTotal = 0;
                        if(snap.exists()){
                            Object.values(snap.val()).forEach(d => {
                                if(d.status === "Success" || d.status === "Successful") currentTotal += parseFloat(d.amount || 0);
                            });
                        }
                        update(statsRef, { depositOffset: currentTotal }).then(() => alert("Deposit Cleared!"));
                    });
                } else {
                    get(withdrawsRef).then(snap => {
                        let currentTotal = 0;
                        if(snap.exists()){
                            Object.values(snap.val()).forEach(w => {
                                if(w.status === "Success" || w.status === "Successful") currentTotal += parseFloat(w.amount || 0);
                            });
                        }
                        update(statsRef, { withdrawOffset: currentTotal }).then(() => alert("Withdraw Cleared!"));
                    });
                }
            });
        };

        fetchAllUserData();

        window.updateWallet = (uid, newVal) => {
            update(ref(db, `users/${uid}`), { wallet: parseFloat(newVal) }).then(() => alert("Wallet Updated!"));
        };

        window.toggleBan = (uid, currentStatus) => {
            const newStatus = (currentStatus === "Banned") ? "Active" : "Banned";
            showConfirm("Status Change", "User status change karein?", function() {
                update(ref(db, `users/${uid}`), { status: newStatus });
            });
        };

        window.deleteUser = (uid) => {
            showConfirm("Delete User", "User hamesha ke liye delete karein?", function() {
                remove(ref(db, `users/${uid}`)).then(() => alert("User deleted!"));
            });
        };

        document.getElementById('userSearch').addEventListener('keyup', function() {
            let filter = this.value.toUpperCase();
            let rows = userTableBody.getElementsByTagName('tr');
            for (let i = 0; i < rows.length; i++) {
                let text = rows[i].innerText.toUpperCase();
                rows[i].style.display = text.indexOf(filter) > -1 ? "" : "none";
            }
        });
    </script>
</body>
</html>
