<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Wallet & Requests</title>
    <style>
        body { background: #0F0C29; color: white; font-family: sans-serif; padding: 15px; }
        .card { background: #1A1A3C; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #FF4C60; }
        
        .scroll-container { 
            display: flex; 
            overflow-x: auto; 
            gap: 15px; 
            padding-bottom: 10px;
            scroll-snap-type: x mandatory;
        }
        .scroll-container::-webkit-scrollbar { height: 5px; }
        .scroll-container::-webkit-scrollbar-thumb { background: #FF4C60; border-radius: 10px; }

        .req-item { 
            min-width: 280px; 
            max-width: 280px;
            background: #0F0C29; 
            padding: 15px; 
            border-radius: 8px; 
            border-left: 4px solid #4ed1ff; 
            position: relative; 
            scroll-snap-align: start;
            flex-shrink: 0;
        }

        .deposit { border-left-color: #2ecc71; }
        .withdraw { border-left-color: #e74c3c; }
        .topup { border-left-color: #f1c40f; } /* Yellow for Topup */
        .success-border { border-left-color: #2ecc71 !important; border-right: 2px solid #2ecc71; }
        .rejected-border { border-left-color: #e74c3c !important; border-right: 2px solid #e74c3c; }
        
        .time-badge { font-size: 10px; color: #aaa; margin-bottom: 10px; display: block; border-bottom: 1px solid #333; padding-bottom: 5px; }
        
        img.ss-preview { width: 100%; max-height: 150px; object-fit: contain; border-radius: 8px; margin: 10px 0; cursor: pointer; border: 1px solid #333; background: #000; }
        .view-link { color: #4ed1ff; font-size: 11px; text-decoration: none; display: block; text-align: center; margin-bottom: 10px; }

        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #0F0C29; color: white; text-align: center; display: block; margin-left: auto; margin-right: auto; }
        button { color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .approve-btn { background: #2ecc71; }
        .reject-btn { background: #e74c3c; }
        .del-btn { background: #444; margin-top: 10px; font-size: 12px; width: auto; padding: 5px 15px; }
        
        .del-all-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .del-all-btn { background: #e74c3c; width: auto; padding: 5px 10px; font-size: 11px; margin: 0; }

        .status-tag { padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .info-p { margin: 8px 0; font-size: 14px; border-bottom: 1px solid #222; padding-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        b { color: #4ed1ff; }
        .payment-done { color: #2ecc71; font-weight: bold; text-align: center; margin: 10px 0; display: block; border: 1px dashed #2ecc71; padding: 5px; border-radius: 5px; font-size: 12px; }
        .payment-rejected { color: #e74c3c; font-weight: bold; text-align: center; margin: 10px 0; display: block; border: 1px dashed #e74c3c; padding: 5px; border-radius: 5px; font-size: 11px; }
    </style>
</head>
<body>

    <h2 style="text-align: center;">Wallet Control</h2>

    <div class="card">
        <h3>Manual Add Balance</h3>
        <p style="font-size: 12px; color: #aaa; text-align: center;">Email ya Phone Number likhein dhoondne ke liye</p>
        <input type="text" id="user-search-input" placeholder="Enter Email OR Phone Number">
        <input type="number" id="wallet-amount" placeholder="Amount to Add">
        
        <input type="text" id="custom-message" placeholder="Custom Message (Optional)">
        
        <button class="approve-btn" onclick="manualAddWallet()">ADD BALANCE NOW</button>
    </div>

    <div class="card">
        <div class="del-all-header">
            <h3>Deposit Requests</h3>
            <button class="del-all-btn" onclick="deleteAll('Requests/Deposits')">DELETE ALL</button>
        </div>
        <div id="deposit-list" class="scroll-container">Loading Deposits...</div>
    </div>

    <div class="card">
        <div class="del-all-header">
            <h3>Withdraw Requests</h3>
            <button class="del-all-btn" onclick="deleteAll('Requests/Withdrawals')">DELETE ALL</button>
        </div>
        <div id="withdraw-list" class="scroll-container">Loading Withdrawals...</div>
    </div>

    <div class="card">
        <div class="del-all-header">
            <h3>Topup Requests</h3>
            <button class="del-all-btn" onclick="deleteAll('Requests/Topups')">DELETE ALL</button>
        </div>
        <div id="topup-list" class="scroll-container">Loading Topups...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyANjbQLKEpV0Mj5e5PJzCPZvFo8a5vzy_k",
            authDomain: "ff-tournamint-323ac.firebaseapp.com",
            databaseURL: "https://ff-tournamint-323ac-default-rtdb.firebaseio.com",
            projectId: "ff-tournamint-323ac",
            storageBucket: "ff-tournamint-323ac.firebasestorage.app",
            appId: "1:157085748163:web:848536d10ae58d32398b76"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function formatDateTime(ts) {
            if(!ts) return "No Date";
            const d = new Date(ts);
            return d.toLocaleDateString() + " | " + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        function sendNotification(uid, title, message) {
            const notifRef = database.ref('notifications/' + uid).push();
            notifRef.set({
                title: title,
                message: message,
                time: Date.now(),
                status: "unread"
            });
        }

        async function getEmail(uid, dataEmail) {
            if (dataEmail && dataEmail !== "N/A") return dataEmail;
            try {
                const userSnap = await database.ref('users/' + uid).once('value');
                return userSnap.exists() ? userSnap.val().email : "Unknown User";
            } catch (e) { return "Error Fetching Email"; }
        }

        // --- Deposits ---
        database.ref('Requests/Deposits').on('value', async (snapshot) => {
            const list = document.getElementById('deposit-list');
            list.innerHTML = "";
            if(!snapshot.exists()) {
                list.innerHTML = "<p>No deposit requests found.</p>";
                return;
            }
            
            const dataObj = snapshot.val();
            for (const child of Object.keys(dataObj)) {
                const data = dataObj[child];
                const isSuccess = data.status === "Successful";
                const isRejected = data.status === "Rejected";
                const userEmail = await getEmail(data.userId, data.email);
                const timeStr = formatDateTime(data.timestamp || data.date);

                let statusBg = '#f39c12';
                if(isSuccess) statusBg = '#2ecc71';
                if(isRejected) statusBg = '#e74c3c';

                let cardBorderClass = 'deposit';
                if(isSuccess) cardBorderClass = 'success-border';
                if(isRejected) cardBorderClass = 'rejected-border';

                list.innerHTML += `
                    <div class="req-item ${cardBorderClass}">
                        <span class="time-badge">🕒 ${timeStr}</span>
                        <p class="info-p" title="${userEmail}">Email: <b style="color:#2ecc71">${userEmail}</b></p>
                        <p class="info-p">TID: <b style="color:#f1c40f">${data.tid || 'N/A'}</b></p>
                        <p class="info-p">Amount: <b>RS. ${data.amount}</b></p>
                        <p class="info-p">Status: <span class="status-tag" style="background:${statusBg}">${data.status || 'Pending'}</span></p>
                        ${isRejected && data.reason ? `<p class="info-p" style="color:#ff6b6b; font-size:12px;">Reason: <b>${data.reason}</b></p>` : ''}
                        
                        <img src="${data.screenshot}" class="ss-preview" onclick="window.open(this.src, '_blank')">
                        <a href="${data.screenshot}" target="_blank" class="view-link">🔗 Click to Open & Save Image</a>
                        
                        ${!isSuccess && !isRejected ? 
                            `<button class="approve-btn" onclick="approveDeposit('${data.userId}', ${data.amount}, '${child}')">APPROVE</button>
                             <button class="reject-btn" onclick="rejectRequest('Requests/Deposits', '${child}', '${data.userId}', 'Deposit')">REJECT</button>` : 
                            isSuccess ? `<span class="payment-done">✅ DEPOSIT SUCCESSFUL</span>` : `<span class="payment-rejected">❌ REJECTED</span>`
                        }
                        
                        <button class="del-btn" onclick="deleteRecord('Requests/Deposits', '${child}')">DELETE</button>
                    </div>`;
            }
        });

        // --- Withdrawals ---
        database.ref('Requests/Withdrawals').on('value', async (snapshot) => {
            const list = document.getElementById('withdraw-list');
            list.innerHTML = "";
            if(!snapshot.exists()) {
                list.innerHTML = "<p>No withdraw requests found.</p>";
                return;
            }
            
            const dataObj = snapshot.val();
            for (const child of Object.keys(dataObj)) {
                const data = dataObj[child];
                const isSuccess = data.status === "Successful";
                const isRejected = data.status === "Rejected";
                const userEmail = await getEmail(data.userId, data.email);
                const timeStr = formatDateTime(data.timestamp || data.date);
                
                const uNum = data.num || data.number || "Not Found";
                const uMethod = data.selectedMethod || data.method || "Not Found";
                const uName = data.name || data.accountName || "N/A";

                let statusBg = '#f1c40f';
                if(isSuccess) statusBg = '#2ecc71';
                if(isRejected) statusBg = '#e74c3c';

                let cardBorderClass = 'withdraw';
                if(isSuccess) cardBorderClass = 'success-border';
                if(isRejected) cardBorderClass = 'rejected-border';

                list.innerHTML += `
                    <div class="req-item ${cardBorderClass}">
                        <span class="time-badge">🕒 ${timeStr}</span>
                        <p class="info-p" title="${userEmail}">Email: <b style="color:#2ecc71">${userEmail}</b></p>
                        <p class="info-p">Name: <b>${uName}</b></p>
                        <p class="info-p">No: <b style="color:#f1c40f">${uNum}</b></p>
                        <p class="info-p">Amount: <b>${data.amount}</b></p>
                        <p class="info-p">Method: <b style="text-transform:uppercase; color:#4ed1ff">${uMethod}</b></p>
                        <p class="info-p">Status: 
                            <span class="status-tag" style="background: ${statusBg}">
                                ${data.status || 'Pending'}
                            </span>
                        </p>
                        ${isRejected && data.reason ? `<p class="info-p" style="color:#ff6b6b; font-size:12px;">Reason: <b>${data.reason}</b></p>` : ''}
                        
                        ${!isSuccess && !isRejected ? 
                            `<button class="approve-btn" onclick="completeWithdraw('${data.userId}', '${data.amount}', '${child}')">APPROVE SENT</button>
                             <button class="reject-btn" onclick="rejectWithdrawWithRefund('${data.userId}', '${data.amount}', '${child}', 'Withdrawal')">REJECT & REFUND</button>` : 
                            isSuccess ? `<span class="payment-done">✅ PAYMENT COMPLETED</span>` : `<span class="payment-rejected">❌ REJECTED</span>`
                        }
                        
                        <button class="del-btn" onclick="deleteRecord('Requests/Withdrawals', '${child}')">DELETE</button>
                    </div>`;
            }
        });

        // --- Topup Requests Listener ---
        database.ref('Requests/Topups').on('value', async (snapshot) => {
            const list = document.getElementById('topup-list');
            list.innerHTML = "";
            if(!snapshot.exists()) {
                list.innerHTML = "<p>No topup requests found.</p>";
                return;
            }
            
            const dataObj = snapshot.val();
            for (const child of Object.keys(dataObj)) {
                const data = dataObj[child];
                const isSuccess = data.status === "Successful";
                const isRejected = data.status === "Rejected";
                const userEmail = await getEmail(data.userId, data.email);
                const timeStr = formatDateTime(data.timestamp || data.date);
                
                let statusBg = '#f1c40f';
                if(isSuccess) statusBg = '#2ecc71';
                if(isRejected) statusBg = '#e74c3c';

                let cardBorderClass = 'topup';
                if(isSuccess) cardBorderClass = 'success-border';
                if(isRejected) cardBorderClass = 'rejected-border';

                list.innerHTML += `
                    <div class="req-item ${cardBorderClass}">
                        <span class="time-badge">🕒 ${timeStr}</span>
                        <p class="info-p">Email: <b style="color:#2ecc71">${userEmail}</b></p>
                        <p class="info-p">Player Name: <b>${data.playerName || 'N/A'}</b></p>
                        <p class="info-p">Player ID: <b style="color:#f1c40f">${data.playerId || 'N/A'}</b></p>
                        <p class="info-p">Item: <b style="color:#4ed1ff">${data.itemName || 'Diamond Pack'}</b></p>
                        <p class="info-p">Price: <b>${data.amount} PKR</b></p>
                        <p class="info-p">Status: 
                            <span class="status-tag" style="background: ${statusBg}">
                                ${data.status || 'Pending'}
                            </span>
                        </p>
                        ${isRejected && data.reason ? `<p class="info-p" style="color:#ff6b6b; font-size:12px;">Reason: <b>${data.reason}</b></p>` : ''}
                        
                        ${!isSuccess && !isRejected ? 
                            `<button class="approve-btn" onclick="approveTopup('${data.userId}', '${data.itemName}', '${child}')">APPROVE TOPUP</button>
                             <button class="reject-btn" onclick="rejectTopupWithRefund('${data.userId}', '${data.amount}', '${child}', '${data.itemName}')">REJECT & REFUND</button>` : 
                            isSuccess ? `<span class="payment-done">✅ TOPUP DONE</span>` : `<span class="payment-rejected">❌ REJECTED</span>`
                        }
                        
                        <button class="del-btn" onclick="deleteRecord('Requests/Topups', '${child}')">DELETE</button>
                    </div>`;
            }
        });

        function approveDeposit(uid, amount, reqId) {
            if(confirm("Approve deposit and add balance?")) {
                const userRef = database.ref('users/' + uid + '/wallet');
                userRef.transaction(current => (current || 0) + parseInt(amount))
                .then(() => {
                    database.ref('Requests/Deposits/' + reqId).update({ status: "Successful" })
                    .then(() => {
                        sendNotification(uid, "Deposit Approved", `Aapka RS. ${amount} ka deposit approve ho gaya hai.`);
                        alert("Deposit Approved!");
                    });
                });
            }
        }

        function completeWithdraw(uid, amount, reqId) {
            if(confirm("Mark this payment as SENT?")) {
                database.ref('Requests/Withdrawals/' + reqId).update({ status: "Successful" })
                .then(() => {
                    sendNotification(uid, "Withdraw Completed", `Aapka RS. ${amount} ka withdraw process ho chuka hai.`);
                    alert("Marked as Successful!");
                });
            }
        }

        function approveTopup(uid, itemName, reqId) {
            if(confirm(`Approve ${itemName} Topup?`)) {
                database.ref('Requests/Topups/' + reqId).update({ status: "Successful" })
                .then(() => {
                    sendNotification(uid, "Topup Successful", `Aapka ${itemName} ka order successful ho chuka hai. Check your game!`);
                    alert("Topup Approved!");
                });
            }
        }

        function rejectRequest(path, reqId, uid, typeName) {
            const reason = prompt("Reject karne ki wajah (Reason) likhein:");
            if (reason === null) return; // Cancelled
            const finalReason = reason.trim() || "Admin ne request reject kar di hai.";

            database.ref(path + '/' + reqId).update({ 
                status: "Rejected", 
                reason: finalReason 
            }).then(() => {
                sendNotification(uid, `${typeName} Rejected`, `Aapki request reject ho gayi hai. Wajah: ${finalReason}`);
                alert("Request Rejected!");
            });
        }

        function rejectWithdrawWithRefund(uid, amount, reqId, typeName) {
            const reason = prompt("Reject karne ki wajah (Reason) likhein (Amount wallet mein wapas chali jayegi):");
            if (reason === null) return;
            const finalReason = reason.trim() || "Admin ne request reject kar di hai.";

            const userRef = database.ref('users/' + uid + '/wallet');
            userRef.transaction(current => (current || 0) + parseInt(amount))
            .then(() => {
                database.ref('Requests/Withdrawals/' + reqId).update({ 
                    status: "Rejected", 
                    reason: finalReason 
                }).then(() => {
                    sendNotification(uid, `${typeName} Rejected & Refunded`, `Aapka withdraw reject ho gaya hai aur RS. ${amount} wallet mein wapas bhej diye gaye hain. Wajah: ${finalReason}`);
                    alert("Rejected & Amount Refunded!");
                });
            });
        }

        function rejectTopupWithRefund(uid, amount, reqId, itemName) {
            const reason = prompt("Reject karne ki wajah (Reason) likhein (Amount wallet mein wapas chali jayegi):");
            if (reason === null) return;
            const finalReason = reason.trim() || "Admin ne request reject kar di hai.";

            const userRef = database.ref('users/' + uid + '/wallet');
            userRef.transaction(current => (current || 0) + parseInt(amount))
            .then(() => {
                database.ref('Requests/Topups/' + reqId).update({ 
                    status: "Rejected", 
                    reason: finalReason 
                }).then(() => {
                    sendNotification(uid, `Topup Rejected & Refunded`, `Aapka ${itemName} topup reject ho gaya hai aur RS. ${amount} wallet mein wapas bhej diye gaye hain. Wajah: ${finalReason}`);
                    alert("Topup Rejected & Amount Refunded!");
                });
            });
        }

        function deleteRecord(path, reqId) {
            if(confirm("Delete this history?")) {
                database.ref(path + '/' + reqId).remove().then(() => alert("Deleted!"));
            }
        }

        function deleteAll(path) {
            if(confirm("⚠️ KYA AAP SURE HAIN? Sabhi history delete ho jayegi!")) {
                database.ref(path).remove().then(() => alert("All History Cleared!"));
            }
        }

        async function manualAddWallet() {
            const searchQuery = document.getElementById('user-search-input').value.trim();
            const amount = parseInt(document.getElementById('wallet-amount').value);
            const customMsg = document.getElementById('custom-message').value.trim();

            if (!searchQuery || !amount) return alert("Email/Phone aur Amount dono bharein!");

            database.ref('users').orderByChild('email').equalTo(searchQuery).once('value', (snapshot) => {
                if (snapshot.exists()) {
                    let uid = Object.keys(snapshot.val())[0]; 
                    addBalance(uid, amount, customMsg);
                } else {
                    database.ref('users').orderByChild('phone').equalTo(searchQuery).once('value', (phoneSnap) => {
                        if (phoneSnap.exists()) {
                            let uid = Object.keys(phoneSnap.val())[0];
                            addBalance(uid, amount, customMsg);
                        } else {
                            alert("User nahi mila!");
                        }
                    });
                }
            });
        }

        function addBalance(uid, amount, customMsg) {
            const finalMessage = customMsg ? customMsg : `Admin ne aapke wallet mein RS. ${amount} add kiye hain.`;

            database.ref('users/' + uid + '/wallet').transaction(curr => (curr || 0) + amount)
            .then(() => { 
                sendNotification(uid, "Wallet Updated", finalMessage);
                alert("Balance Successfully Added!"); 
                document.getElementById('wallet-amount').value = ""; 
                document.getElementById('user-search-input').value = "";
                document.getElementById('custom-message').value = ""; 
            })
            .catch(err => alert("Error: " + err.message));
        }
    </script>
</body>
</html>
