<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1024">
    <title>Admin Panel -FF GameZone PK Pro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root { --accent: #ffcc00; --bg: #0d0d0d; --card: #1a1a1a; --input: #262626; --danger: #ff4d4d; --success: #2ecc71; --special: #e67e22; --blue-label: #3498db; --local: #0088ff; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; padding: 15px; margin: 0; min-width: 1024px; }
        
        /* --- 3 CARDS IN ONE ROW CONTAINER --- */
        .creation-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            width: 100%;
        }

        .admin-card { 
            background: var(--card); 
            padding: 20px; 
            border-radius: 15px; 
            border: 1px solid #333; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
            position: relative; 
            overflow: hidden; 
            flex: 1;
        }
        
        .corner-input { position: absolute; top: 0; left: 0; background: var(--blue-label); color: white; border: none; width: 50px; padding: 5px; text-align: center; font-weight: bold; border-bottom-right-radius: 15px; font-size: 14px; outline: none; z-index: 10; box-shadow: 2px 2px 10px rgba(0,0,0,0.5); }

        h2 { color: var(--accent); font-size: 1.1rem; text-align: center; margin-bottom: 20px; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 5px; }
        .row { display: flex; gap: 12px; margin-bottom: 15px; }
        .col { flex: 1; display: flex; flex-direction: column; }
        label { font-size: 11px; color: #aaa; margin-bottom: 5px; font-weight: 600; text-transform: uppercase; }
        input, select { background: var(--input); border: 1px solid #444; color: #fff; padding: 10px; border-radius: 8px; outline: none; font-size: 13px; }
        
        /* Dynamic Box Control Styles */
        .btn-add-box { background: #222; border: 1px dashed var(--accent); color: var(--accent); padding: 8px; font-size: 11px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; margin-bottom: 10px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-add-box:hover { background: #2a2a2a; }
        
        .prize-row { display: flex; gap: 8px; margin-bottom: 15px; justify-content: flex-start; flex-wrap: wrap; }
        .prize-box-dynamic { background: #111; border: 1px solid #444; padding: 8px; border-radius: 10px; width: 85px; text-align: center; position: relative; flex-shrink: 0; }
        .prize-box-dynamic input { width: 100%; background: transparent; border: none; text-align: center; font-weight: 900; color: #fff; padding: 2px; font-size: 11px; outline: none; }
        
        /* Icon Selector Dropdown inside Box */
        .icon-select { background: #1a1a1a !important; border: 1px solid #333 !important; font-size: 10px !important; color: var(--accent) !important; margin-bottom: 4px; padding: 2px !important; border-radius: 4px !important; text-align: center; width: 100%; outline: none; }
        
        .tag-input { background: #1a1a1a !important; border: 1px solid #333 !important; font-size: 9px !important; color: #aaa !important; margin-bottom: 4px; padding: 2px !important; border-radius: 4px !important; text-align: center; }
        .btn-remove-box { background: var(--danger); color: white; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; position: absolute; top: -6px; right: -6px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 5; }

        .btn { width: 100%; padding: 15px; background: var(--accent); border: none; font-weight: 800; border-radius: 10px; cursor: pointer; color: #000; font-size: 14px; text-transform: uppercase; margin-top: 10px; }
        .btn-special { background: var(--special); color: #fff; }
        .btn-local { background: var(--local); color: #fff; }
        
        .date-divider { background: #333; color: var(--accent); padding: 12px; border-radius: 8px; margin: 30px 0 15px 0; text-align: center; font-weight: 900; font-size: 18px; text-transform: uppercase; border: 1px solid #444; }

        /* --- LIVE TOURNAMENT UI --- */
        .t-item-wrapper { display: flex; flex-direction: column; margin-bottom: 10px; border: 1px solid #333; background: #111; border-radius: 12px; border-left: 4px solid var(--accent); overflow: hidden; }
        .t-item-wrapper.full-match { border-left-color: var(--danger) !important; background: rgba(255, 77, 77, 0.05); }
        .t-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; cursor: pointer; user-select: none; }
        .t-info { display: flex; flex-direction: column; flex: 1; }
        .t-id-badge { background: var(--blue-label); color: #fff; padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: bold; width: fit-content; margin-bottom: 5px; }
        .t-name { font-size: 15px; font-weight: bold; color: #fff; display: block; }
        .t-tagline { font-size: 11px; color: #888; }
        .t-time-info { font-size: 12px; color: var(--accent); margin-top: 5px; font-weight: bold; }
        
        /* Slots counter pill badge */
        .t-slots-badge { display: inline-flex; align-items: center; gap: 4px; background: rgba(52, 152, 219, 0.2); border: 1px solid var(--blue-label); color: var(--blue-label); padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; margin-top: 6px; width: fit-content; }
        .t-slots-badge.full { background: rgba(255, 77, 77, 0.2); border-color: var(--danger); color: var(--danger); }

        .btn-del-match { background: var(--danger); color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: bold; text-transform: uppercase; margin-left: 10px;}

        /* Expanded Details Box Style */
        .t-details-expand { background: #0a0a0a; border-top: 1px dashed #333; padding: 15px; display: none; }
        .expand-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .expand-item { background: #1a1a1a; padding: 8px; border-radius: 8px; border: 1px solid #333; text-align: center; }
        .expand-label { font-size: 9px; color: #aaa; text-transform: uppercase; display: block; margin-bottom: 3px; font-weight: bold; }
        .expand-value { font-size: 12px; font-weight: 900; color: var(--accent); text-transform: uppercase; }
        .expand-prize-title { font-size: 10px; font-weight: 900; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; text-align: center; display: block; }
        .expand-prize-container { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
        .expand-prize-box { background: #111; border: 1px solid #333; border-radius: 8px; padding: 6px; text-align: center; min-width: 70px; flex: 1; }
        .expand-prize-box span { font-size: 10px; font-weight: 900; color: #fff; display: block; }
        .expand-prize-box .rank-tag { font-size: 7px; color: #888; text-transform: uppercase; font-weight: bold; }

        /* --- PLAYER SCROLL UI --- */
        .match-group-wrapper { margin-bottom: 25px; border-left: 3px solid var(--blue-label); padding-left: 10px; }
        .match-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .match-id-header { background: var(--blue-label); color: white; padding: 5px 12px; border-radius: 5px; font-size: 12px; font-weight: bold; }
        .btn-delete-all { background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 5px; font-size: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        
        .player-scroll-container { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 10px; scroll-snap-type: x mandatory; }
        .player-scroll-container::-webkit-scrollbar { height: 5px; }
        .player-scroll-container::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        .player-card { background: #1f1f1f; padding: 18px; border-radius: 12px; border: 1px solid #333; position: relative; min-width: 280px; max-width: 280px; flex-shrink: 0; scroll-snap-align: start; }
        .badge-group { display: flex; gap: 5px; margin-bottom: 8px; align-items: center; }
        .player-count-badge { background: var(--blue-label); color: white; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .time-stamp-big { font-size: 14px; color: var(--accent); font-weight: 900; margin-left: auto; }
        .player-detail { color: #fff; font-weight: 900; font-size: 16px; margin-bottom: 2px; }
        .player-uid { color: #3498db; font-size: 14px; font-weight: bold; font-family: monospace; display: block; margin-bottom: 12px; }

        .app-user-info { display: flex; align-items: center; gap: 10px; background: #262626; padding: 10px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #444; }
        .app-user-photo { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); }
        .app-user-text { flex: 1; overflow: hidden; }
        .app-user-name { font-size: 13px; font-weight: 800; color: var(--accent); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .app-user-email { font-size: 10px; color: #bbb; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .room-box { background: #111; padding: 12px; border-radius: 10px; border: 1px solid #222; margin-top: 10px; }
        .room-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .room-input { flex: 1; background: #000; border: 1px solid #444; color: var(--accent); padding: 10px; border-radius: 8px; font-size: 13px; outline: none; width: 40%; }
        
        .btn-send-large { background: var(--success); color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        .done-section { display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(46, 204, 113, 0.1); border: 1px dashed var(--success); padding: 15px; border-radius: 10px; margin-top: 10px; }
        .done-tick { color: var(--success); font-size: 30px; margin-bottom: 5px; }
        .done-time { font-size: 11px; color: #2ecc71; font-weight: bold; text-transform: uppercase; }
        .btn-delete-player { background: var(--danger); color: white; border: none; width: 100%; padding: 10px; border-radius: 8px; cursor: pointer; margin-top: 10px; font-weight: bold; font-size: 12px; }

        /* CUSTOM CONFIRM MODAL STYLING */
        #customModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .custom-modal-content {
            background: #1a1a3c;
            padding: 22px;
            border-radius: 14px;
            width: 90%;
            max-width: 330px;
            border: 1px solid #ff4c60;
            text-align: center;
            box-shadow: 0 0 25px rgba(255, 76, 96, 0.3);
        }
        .custom-modal-content h3 { margin-top: 0; color: #fff; font-size: 1.2rem; }
        .custom-modal-content p { color: #ccc; font-size: 14px; margin: 15px 0; }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .modal-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-cancel { background: #333; color: #fff; }
        .btn-danger { background: #ff3333; color: #fff; }
    </style>
</head>
<body>

    <div class="creation-container">
        <!-- SIMPLE MATCH -->
        <div class="admin-card">
            <input type="text" id="badge_val1" class="corner-input" value="1">
            <h2><i class="bi bi-controller"></i> Create Simple Match</h2>
            <div class="row">

                <div class="col"><label>Tag Line</label><input type="text" id="tagline1" placeholder="Join Now"></div>
            </div>
            <div class="row">

                <div class="col"><label>Map Name</label><input type="text" id="map1" placeholder="Bermuda"></div>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                <label style="margin-bottom: 0;">Prize Distribution</label>
                <button type="button" class="btn-add-box" onclick="addPrizeBox(1, 'bi-trophy-fill', '1ST PLACE', '800 PKR')"><i class="bi bi-plus-lg"></i> Add Box</button>

            <button class="btn" onclick="uploadTournament(1)">Post Simple Match</button>
        </div>

        <!-- SPECIAL MATCH -->
        <div class="admin-card" style="border: 1px solid var(--special);">
            <input type="text" id="badge_val2" class="corner-input" style="background: var(--special);" value="2">
            <h2 style="color: var(--special);"><i class="bi bi-fire"></i> Create Special (Per Kill)</h2>
            <div class="row">
                <div class="col"><label>Title</label><input type="text" id="title2" placeholder="Pro Night Kill"></div>
                <div class="col"><label>Tag Line</label><input type="text" id="tagline2" placeholder="High Stakes"></div>
            </div>
            <div class="row">
                <div class="col"><label>Match Mode</label><select id="mode2"><option value="Battle Royale">BATTLE ROYALE</option><option value="Clash Squad">Clash Squad</option></select></div>
                <div class="col"><label>Map Name</label><input type="text" id="map2" placeholder="Purgatory"></div>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                <label style="margin-bottom: 0; color: var(--special);">Prize Distribution</label>
                <button type="button" class="btn-add-box" style="border-color: var(--special); color: var(--special);" onclick="addPrizeBox(2, 'bi-award-fill', '1 KILL', '1000')"><i class="bi bi-plus-lg"></i> Add Box</button>
            </div>
            <div class="prize-row" id="prize_container2"></div>

            <div class="row">
                <div class="col"><label>Per Kill Rs.</label><input type="number" id="perKill2" placeholder="20"></div>
                <div class="col"><label>Slots</label><input type="number" id="slots2" value="48"></div>
            </div>
            <div class="row">
                <div class="col"><label>Entry Fee</label><input type="number" id="fee2" value="100"></div>
                <div class="col"><label>Total Prize</label><input type="text" id="prize2" value="5000"></div>
            </div>
            <div class="row">
                <div class="col"><label>Match Date</label><input type="date" id="match_date2"></div>
                <div class="col"><label>Match Time</label><input type="time" id="match_time2"></div>
            </div>
            <button class="btn btn-special" onclick="uploadTournament(2)">Post Special Match</button>
        </div>

        <!-- LOCAL MATCH -->
        <div class="admin-card" style="border: 1px solid var(--local);">
            <input type="text" id="badge_val3" class="corner-input" style="background: var(--local);" value="3">
            <h2 style="color: var(--local);"><i class="bi bi-geo-alt-fill"></i> Create Local Match</h2>
            <div class="row">
                <div class="col"><label>Title</label><input type="text" id="title3" placeholder="Local Tournament"></div>
                <div class="col"><label>Tag Line</label><input type="text" id="tagline3" placeholder="Area Players"></div>
            </div>
            <div class="row">
                <div class="col"><label>Match Mode (Manual)</label><input type="text" id="mode3" placeholder="e.g. 4vs4 Custom"></div>
                <div class="col"><label>Map Name</label><input type="text" id="map3" placeholder="Bermuda"></div>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                <label style="margin-bottom: 0; color: var(--local);">Prize Distribution</label>
                <button type="button" class="btn-add-box" style="border-color: var(--local); color: var(--local);" onclick="addPrizeBox(3, 'bi-trophy-fill', 'WINNER', '1000 PKR')"><i class="bi bi-plus-lg"></i> Add Box</button>
            </div>
            <div class="prize-row" id="prize_container3"></div>

            <div class="row">
                <div class="col">
                    <label>Total Prize (Display)</label>
                    <input type="text" id="prize3" placeholder="e.g. 5000" value="1000">
                </div>
            </div>

            <div class="row">
                <div class="col"><label>Slots</label><input type="number" id="slots3" value="48"></div>
                <div class="col"><label>Entry Fee</label><input type="number" id="fee3" value="30"></div>
            </div>
            <div class="row">
                <div class="col"><label>Match Date</label><input type="date" id="match_date3"></div>
                <div class="col"><label>Match Time</label><input type="time" id="match_time3"></div>
            </div>
            <button class="btn btn-local" onclick="uploadTournament(3)">Post Local Match</button>
        </div>
    </div>

    <!-- CUSTOM CONFIRM MODAL POPUP CONTAINER -->
    <div id="customModal">
        <div class="custom-modal-content">
            <h3 id="modalTitle">Confirmation</h3>
            <p id="modalText">Are you sure?</p>
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" onclick="closeConfirmModal()">Cancel</button>
                <button class="modal-btn btn-danger" id="modalOkBtn">Confirm</button>
            </div>
        </div>
    </div>

    <div class="admin-card">
        <h2>Live Tournaments (Manage)</h2>
        <div id="liveList"></div>
    </div>

    <div class="admin-card">
        <h2>Joined Players Control</h2>
        <div id="playerContainer"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyANjbQLKEpV0Mj5e5PJzCPZvFo8a5vzy_k",
            authDomain: "ff-tournamint-323ac.firebaseapp.com",
            databaseURL: "https://ff-tournamint-323ac-default-rtdb.firebaseio.com",
            projectId: "ff-tournamint-323ac",
            storageBucket: "ff-tournamint-323ac.firebasestorage.app",
            messagingSenderId: "157085748163",
            appId: "1:157085748163:web:848536d10ae58d32398b76",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Custom Confirmation Modal Functions
        function showConfirm(title, text, callback) {
            document.getElementById("modalTitle").innerText = title;
            document.getElementById("modalText").innerText = text;
            const okBtn = document.getElementById("modalOkBtn");
            document.getElementById("customModal").style.display = "flex";
            
            okBtn.onclick = function() {
                closeConfirmModal();
                callback();
            };
        }

        function closeConfirmModal() {
            document.getElementById("customModal").style.display = "none";
        }

        // Dynamic Prize Boxes Handler with Icon selector
        function addPrizeBox(type, selectedIcon = 'bi-trophy-fill', tagValue = '', prizeValue = '') {
            const container = document.getElementById('prize_container' + type);
            const boxId = 'box_' + Date.now() + Math.random().toString(36).substring(2, 5);
            
            const boxDiv = document.createElement('div');
            boxDiv.className = 'prize-box-dynamic';
            boxDiv.id = boxId;
            boxDiv.innerHTML = `
                <button type="button" class="btn-remove-box" onclick="this.parentElement.remove()"><i class="bi bi-x"></i></button>
                <select class="icon-select" onchange="updateBoxIcon(this)">
                    <option value="bi-trophy-fill" ${selectedIcon === 'bi-trophy-fill' ? 'selected' : ''}>🏆 Trophy</option>
                    <option value="bi-award-fill" ${selectedIcon === 'bi-award-fill' ? 'selected' : ''}>🥇 Award</option>
                    <option value="bi-fire" ${selectedIcon === 'bi-fire' ? 'selected' : ''}>🔥 Kill/Fire</option>
                    <option value="bi-star-fill" ${selectedIcon === 'bi-star-fill' ? 'selected' : ''}>⭐ Star</option>
                    <option value="bi-shield-fill-check" ${selectedIcon === 'bi-shield-fill-check' ? 'selected' : ''}>🛡️ Shield</option>
                </select>
                <input type="text" class="tag-input" placeholder="Label" value="${tagValue}">
                <input type="text" class="val-input" placeholder="Prize" value="${prizeValue}">
            `;
            container.appendChild(boxDiv);
        }

        function updateBoxIcon(selectElement) {
            // Optional callback or styling if needed when icon changes
        }

        // Restore default layout boxes on load
        window.onload = function() {
            // Card 1 Defaults
            addPrizeBox(1, 'bi-trophy-fill', '1ST PLACE', '800 PKR');
            addPrizeBox(1, 'bi-award-fill', '2ND PLACE', '500 PKR');
            addPrizeBox(1, 'bi-award-fill', '3RD PLACE', '300 PKR');

            // Card 2 Defaults
            addPrizeBox(2, 'bi-fire', '1 KILL', '1000');
            addPrizeBox(2, 'bi-fire', '2 KILL', '600');
            addPrizeBox(2, 'bi-fire', '3 KILL', '400');

            // Card 3 Defaults
            addPrizeBox(3, 'bi-trophy-fill', 'WINNER', '1000 PKR');

            setupExtraCardBadges();
        };

        function setupExtraCardBadges() {
            const c2 = document.getElementById('badge_val2');
            const c3 = document.getElementById('badge_val3');
            if(c2 && !c2.value) c2.value = "2";
            if(c3 && !c3.value) c3.value = "3";
        }

        function uploadTournament(type) {
            const id = Date.now().toString();
            const manualBadge = document.getElementById('badge_val' + type).value;
            let data = { id: id, status: "upcoming", timestamp: id, tourneyNum: manualBadge }; 
            const mDate = document.getElementById('match_date' + type).value;
            const mTime = document.getElementById('match_time' + type).value;
            if(!mDate && !mTime) return alert("Fill at least Date or Time!");
            data.mDate = mDate; data.mTime = mTime;
            data.title = document.getElementById('title' + type).value;
            data.tagLine = document.getElementById('tagline' + type).value || "";
            data.totalSlots = document.getElementById('slots' + type).value;
            data.entryFee = document.getElementById('fee' + type).value;
            data.totalPrize = document.getElementById('prize' + type).value;
            data.version = document.getElementById('map' + type).value || "Classic";

            const container = document.getElementById('prize_container' + type);
            const boxElements = container.getElementsByClassName('prize-box-dynamic');
            let prizeDistribution = {};
            
            for (let i = 0; i < boxElements.length; i++) {
                const iconVal = boxElements[i].querySelector('.icon-select').value;
                const tag = boxElements[i].querySelector('.tag-input').value.trim() || `Prize ${i+1}`;
                const val = boxElements[i].querySelector('.val-input').value.trim() || "0";
                prizeDistribution[`prize_${i+1}`] = { icon: iconVal, label: tag, amount: val };
            }
            data.prizeDistribution = prizeDistribution;

            if(type === 1) {
                data.type = document.getElementById('mode1').value;
                data.perKill = "HIDE";
            } else if(type === 2) {
                data.type = document.getElementById('mode2').value;
                data.perKill = document.getElementById('perKill2').value;
            } else if(type === 3) {
                data.type = document.getElementById('mode3').value || "Custom Mode";
                data.perKill = "HIDE";
                data.isLocal = true;
            }

            if(!data.title) return alert("Fill Title!");
            db.ref('tournaments/' + id).set(data).then(() => alert("Match Posted! ✅"));
        }

        function toggleExpandLiveItem(id) {
            const box = document.getElementById('expandBox_' + id);
            if (box) {
                box.style.display = (box.style.display === 'block') ? 'none' : 'block';
            }
        }

        function sendRoomDetails(regId) {
            const roomId = document.getElementById(`room_${regId}`).value;
            const pass = document.getElementById(`pass_${regId}`).value;
            if(!roomId || !pass) return alert("Enter Details!");
            const sentTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
            db.ref('registrations/' + regId).update({ roomID: roomId, roomPass: pass, sentAt: sentTime }).then(() => alert("Room Details Sent! 🎮"));
        }

        function deleteMatch(key) { 
            showConfirm("Delete Match", "Kya aap is Match ko delete karna chahte hain?", function() {
                db.ref('tournaments/' + key).remove().then(() => alert("Match Deleted!"));
            });
        }

        function deletePlayer(key) { 
            showConfirm("Remove Player", "Kya aap is player ko remove karna chahte hain?", function() {
                db.ref('registrations/' + key).remove().then(() => alert("Player Removed!"));
            });
        }

        async function deleteAllInMatch(matchId) {
            showConfirm("Delete All Players", `Match ID: ${matchId} ke sabhi registered players ko delete karein?`, async function() {
                const snap = await db.ref('registrations').get();
                if(snap.exists()) {
                    const updates = {};
                    snap.forEach(child => { if(child.val().tourneyNum == matchId) updates[child.key] = null; });
                    db.ref('registrations').update(updates).then(() => alert("All players removed! 🔥"));
                }
            });
        }

        function getFormattedDate(ts) {
            const d = new Date(Number(ts));
            const now = new Date();
            const yesterday = new Date(); yesterday.setDate(now.getDate() - 1);
            let label = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' });
            let dayName = "";
            if(d.toDateString() === now.toDateString()) dayName = "TODAY";
            else if(d.toDateString() === yesterday.toDateString()) dayName = "YESTERDAY";
            return { dayName, fullDate: label, time: d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true }) };
        }

        let globalRegistrationsCount = {};

        db.ref('registrations').on('value', (snap) => {
            globalRegistrationsCount = {};
            snap.forEach(c => {
                const reg = c.val();
                const mNum = reg.tourneyNum;
                if(mNum) {
                    globalRegistrationsCount[mNum] = (globalRegistrationsCount[mNum] || 0) + 1;
                }
            });
            triggerTournamentsRender();
        });

        let latestTournamentsSnap = null;
        db.ref('tournaments').on('value', (snap) => {
            latestTournamentsSnap = snap;
            triggerTournamentsRender();
        });

        function triggerTournamentsRender() {
            if(!latestTournamentsSnap) return;
            const list = document.getElementById('liveList');
            list.innerHTML = "";
            latestTournamentsSnap.forEach(c => {
                const t = c.val();
                let timeDisplay = (t.mDate && t.mTime) ? `${t.mDate} | ${t.mTime}` : (t.mDate || t.mTime || "");
                
                const matchNum = t.tourneyNum || '??';
                const currentJoined = globalRegistrationsCount[matchNum] || 0;
                const maxSlots = parseInt(t.totalSlots) || 48;
                const isFull = currentJoined >= maxSlots;

                let prizeListHtml = "";
                if(t.prizeDistribution) {
                    const dist = t.prizeDistribution;
                    Object.keys(dist).forEach((key) => {
                        const pObj = dist[key];
                        prizeListHtml += `
                            <div class="expand-prize-box">
                                <i class="bi ${pObj.icon || 'bi-trophy-fill'}" style="color: var(--accent); font-size: 14px; display: block; margin-bottom: 2px;"></i>
                                <span class="rank-tag">${pObj.label || 'Prize'}</span>
                                <span>${pObj.amount || '0'}</span>
                            </div>
                        `;
                    });
                }

                list.innerHTML += `
                <div class="t-item-wrapper ${isFull ? 'full-match' : ''}">
                    <div class="t-item" ondblclick="toggleExpandLiveItem('${t.id}')">
                        <div class="t-info">
                            <span class="t-id-badge">MATCH ID: ${matchNum}</span>
                            <span class="t-name">${t.title}</span>
                            <span class="t-tagline">${t.tagLine || ''}</span>
                            <div class="t-time-info"><i class="bi bi-clock"></i> ${timeDisplay}</div>
                            <div class="t-slots-badge ${isFull ? 'full' : ''}">
                                <i class="bi bi-people-fill"></i> Slots: ${currentJoined} / ${maxSlots} ${isFull ? '(FULL)' : ''}
                            </div>
                        </div>
                        <button class="btn-del-match" onclick="deleteMatch('${c.key}')">DELETE</button>
                    </div>
                    <div id="expandBox_${t.id}" class="t-details-expand">
                        <div class="expand-grid">
                            <div class="expand-item"><span class="expand-label">Entry Fee</span><span class="expand-value">Rs.${t.entryFee || '0'}</span></div>
                            <div class="expand-item"><span class="expand-label">Total Prize</span><span class="expand-value">Rs.${t.totalPrize || '0'}</span></div>
                            <div class="expand-item"><span class="expand-label">Map/Version</span><span class="expand-value">${t.version || 'Classic'}</span></div>
                            <div class="expand-item"><span class="expand-label">Mode</span><span class="expand-value">${t.type || 'N/A'}</span></div>
                            <div class="expand-item"><span class="expand-label">Slots Filled</span><span class="expand-value">${currentJoined} / ${maxSlots}</span></div>
                            ${t.perKill && t.perKill !== "HIDE" && t.perKill !== "0" ? `<div class="expand-item"><span class="expand-label">Per Kill</span><span class="expand-value">Rs.${t.perKill}</span></div>` : ''}
                        </div>
                        ${prizeListHtml ? `<span class="expand-prize-title"><i class="bi bi-trophy"></i> Prize Distribution</span><div class="expand-prize-container">${prizeListHtml}</div>` : ''}
                    </div>
                </div>`;
            });
        }

        db.ref('registrations').on('value', async (snap) => {
            const container = document.getElementById('playerContainer');
            container.innerHTML = "<p style='text-align:center; padding:20px; color:#666;'>Syncing Player Profiles...</p>";
            const regs = [];
            snap.forEach(c => { regs.push({ key: c.key, ...c.val() }); });
            regs.sort((a,b) => b.timestamp - a.timestamp);
            const groups = {};
            regs.forEach(p => {
                const dateInfo = getFormattedDate(p.timestamp);
                const dateKey = dateInfo.fullDate;
                if(!groups[dateKey]) groups[dateKey] = { dayName: dateInfo.dayName, matches: {} };
                const mId = p.tourneyNum || "Unknown";
                if(!groups[dateKey].matches[mId]) groups[dateKey].matches[mId] = [];
                groups[dateKey].matches[mId].push(p);
            });
            let htmlContent = "";
            for (const date in groups) {
                htmlContent += `<div class="date-divider">${groups[date].dayName ? groups[date].dayName + " - " : ""}${date}</div>`;
                for (const mId in groups[date].matches) {
                    htmlContent += `<div class="match-group-wrapper"><div class="match-header-row"><div class="match-id-header">MATCH ID: ${mId}</div><button class="btn-delete-all" onclick="deleteAllInMatch('${mId}')">Delete All</button></div><div class="player-scroll-container">`;
                    let counter = 0;
                    for (const p of groups[date].matches[mId]) {
                        counter++;
                        const time = new Date(Number(p.timestamp)).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
                        let userProfile = { profilePic: "", displayName: "Guest", email: "N/A" };
                        if(p.uid) {
                            const userSnap = await db.ref('users/' + p.uid).get();
                            if(userSnap.exists()) userProfile = userSnap.val();
                        }
                        let controlHtml = p.isDone ? `<div class="done-section"><i class="bi bi-patch-check-fill done-tick"></i><div class="done-time">JOINED ✅</div><button class="btn-delete-player" onclick="deletePlayer('${p.key}')">REMOVE</button></div>` : `<div class="room-box"><div class="room-row"><input type="text" id="room_${p.key}" class="room-input" placeholder="Room ID" value="${p.roomID || ''}"><input type="text" id="pass_${p.key}" class="room-input" placeholder="Pass" value="${p.roomPass || ''}"></div><button class="btn-send-large" onclick="sendRoomDetails('${p.key}')">SEND ROOM</button><button class="btn-delete-player" style="background:#333;" onclick="deletePlayer('${p.key}')">REMOVE</button></div>`;
                        htmlContent += `<div class="player-card"><div class="badge-group"><span class="player-count-badge">#${counter}</span><span class="time-stamp-big">${time}</span></div><div class="app-user-info"><img src="${userProfile.profilePic || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="app-user-photo"><div class="app-user-text"><p class="app-user-name">${userProfile.displayName}</p><p class="app-user-email">${userProfile.email}</p></div></div><div class="player-detail">${p.playerName}</div><div class="player-uid">UID: ${p.playerUID || "N/A"}</div>${controlHtml}</div>`;
                    }
                    htmlContent += `</div></div>`;
                }
            }
            container.innerHTML = htmlContent || "<p style='text-align:center;'>No Players Found.</p>";
        });
    </script>
</body>
</html>
