<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=1.0">
    <title>Tournament Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a; 
            --bg-secondary: #1e293b; 
            --text-primary: #f8fafc; 
            --text-secondary: #94a3b8; 
            --accent-primary: #6366f1; 
            --accent-secondary: #10B981;
            --border-color: #334155; 
            --danger-color: #EF4444;
            --input-bg: #0f172a;
        }
        body { background-color: var(--bg-primary); color: var(--text-primary); font-family: 'Poppins', sans-serif; overflow-x: auto; margin: 0; padding: 0; min-width: 1200px; }
        .main-content { padding: 0 !important; margin: 0 !important; width: 1200px; height: 100vh; }
        
        /* Mobile-style Login Container setup */
        #auth-container {
            min-width: 100vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-primary);
        }
        .login-container { 
            width: 100%;
            max-width: 380px; 
            margin: auto; 
            padding: 15px;
        }
        .card { background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 0.75rem; overflow: hidden; color: var(--text-primary); }
        .control-menu .list-group-item { background-color: transparent; border: none; padding: 1rem 1.25rem; color: var(--text-secondary); transition: 0.3s; cursor: pointer; }
        .control-menu .list-group-item.active { background-color: #312e81; border-left: 4px solid var(--accent-primary); color: white; font-weight: 600; }
        .control-menu .list-group-item:hover:not(.active) { background-color: #1e293b; color: white; }
        
        .form-control { background-color: var(--input-bg); border: 1px solid var(--border-color); color: white; }
        .form-control:focus { background-color: var(--input-bg); color: white; border-color: var(--accent-primary); box-shadow: none; }
        .form-label { color: var(--text-secondary); }

        .table { color: var(--text-primary); border-color: var(--border-color); }
        .table img { width: 100px; height: 55px; object-fit: cover; border-radius: 0.5rem; border: 1px solid var(--border-color); }
        .table td { vertical-align: middle; border-bottom-color: var(--border-color); }
        .table-light { --bs-table-bg: #334155; --bs-table-color: white; }
        
        #adminLoader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        h4.card-title { border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem; margin-bottom: 1.5rem; font-weight: 600; color: var(--accent-primary); }
        .upload-status { font-size: 0.85rem; margin-top: 8px; color: var(--accent-secondary); font-weight: 500; }
        
        /* Full Desktop View iframe layout */
        .iframe-container { width: 1200px; height: 100vh; border: none; overflow: auto; background: #0f172a; margin: 0; padding: 0; border-radius: 0; }
        iframe { width: 1200px; height: 100vh; border: none; display: block; }
        
        /* Floating Slide Drawer Trigger Button */
        .drawer-toggle-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: background 0.2s;
        }
        .drawer-toggle-btn:hover {
            background-color: var(--accent-primary);
        }

        /* Drawer Sidebar */
        .sidebar-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            background-color: var(--bg-primary);
            border-right: 1px solid var(--border-color);
            z-index: 1050;
            transition: transform 0.3s ease-in-out;
            transform: translateX(-100%);
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .sidebar-container.open {
            transform: translateX(0);
        }
        
        .main-col-content {
            width: 1200px;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        /* Secret Auto-fill Trigger Style */
        .secret-trigger {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 8px;
            height: 8px;
            background: transparent;
            border-radius: 50%;
            cursor: pointer;
            z-index: 99999;
        }

        /* CUSTOM CONFIRM MODAL STYLES */
        #customModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 20000;
            justify-content: center;
            align-items: center;
        }
        .modal-content-box {
            background: #181818;
            padding: 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 320px;
            border: 1px solid #444;
            text-align: center;
        }
        .modal-content-box h3 { margin-top: 0; color: #fff; font-size: 1.2rem; }
        .modal-content-box p { color: #ccc; font-size: 14px; margin: 15px 0; }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .modal-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-cancel { background: #333; color: #fff; }
        .btn-danger { background: #e74c3c; color: #fff; }
    </style>
</head>
<body>

    <div id="adminLoader" style="display: none;"><div class="spinner-border text-primary" role="status"></div></div>

    <!-- Secret Trigger Dot -->
    <div class="secret-trigger" id="secretTrigger"></div>

    <!-- CUSTOM CONFIRM MODAL -->
    <div id="customModal">
        <div class="modal-content-box">
            <h3 id="modalTitle">Confirmation</h3>
            <p id="modalText">Are you sure?</p>
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="modal-btn btn-danger" id="modalOkBtn">Delete</button>
            </div>
        </div>
    </div>

    <div id="auth-container">
        <div id="admin-setup-section" style="display: none;">
            <div class="login-container">
                <div class="card shadow-lg">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center mb-4 text-white fs-4">Admin Setup</h3>
                        <form id="adminSetupForm">
                            <div class="mb-3"><label class="form-label small">Email</label><input type="email" class="form-control form-control-sm" id="setupEmail" required></div>
                            <div class="mb-3"><label class="form-label small">Password</label><input type="password" class="form-control form-control-sm" id="setupPassword" required minlength="6"></div>
                            <div class="d-grid mt-4"><button type="submit" class="btn btn-success btn-sm fw-bold py-2">Create Admin Account</button></div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div id="admin-login-section" style="display: none;">
            <div class="login-container">
                <div class="card shadow-lg">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center mb-4 text-white fs-4">Admin Login</h3>
                        <form id="adminLoginForm">
                            <div class="mb-3"><label class="form-label small">Email</label><input type="email" class="form-control form-control-sm" id="adminEmail" required></div>
                            <div class="mb-3"><label class="form-label small">Password</label><input type="password" class="form-control form-control-sm" id="adminPassword" required></div>
                            <div class="d-grid mt-4"><button type="submit" class="btn btn-primary btn-sm fw-bold py-2">Login</button></div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="admin-main-area" style="display: none;">
        <!-- Floating Toggle Button to open drawer -->
        <button class="drawer-toggle-btn" id="drawerToggleBtn" title="Toggle Menu"><i class="bi bi-list"></i></button>

        <!-- Sidebar Drawer Container -->
        <div class="sidebar-container p-3 overflow-y-auto" id="sidebarContainer">
            <div>
                <div class="d-flex justify-content-between align-items-center mb-3 px-2 pt-2">
                    <h5 class="text-white m-0 fw-bold" style="font-size: 1.1rem; color: var(--accent-primary) !important;">Admin Menu</h5>
                    <button class="btn btn-sm btn-dark border-secondary text-white" id="closeDrawerBtn"><i class="bi bi-x-lg"></i></button>
                </div>
                <hr class="border-secondary my-2">
                <div class="card border-0 bg-transparent">
                    <div class="list-group list-group-flush control-menu" id="controlMenu">
                        <a class="list-group-item list-group-item-action active" data-pane="manageSliders"><i class="bi bi-images me-2"></i> Manage Sliders</a>
                        <a class="list-group-item list-group-item-action" data-pane="usersControl"><i class="bi bi-people me-2"></i> Users Control</a>
                        <a class="list-group-item list-group-item-action" data-pane="tournamentsControl"><i class="bi bi-trophy me-2"></i> Tournaments Control</a>
                        <a class="list-group-item list-group-item-action" data-pane="walletControl"><i class="bi bi-wallet2 me-2"></i> Wallet Control</a>
                        <a class="list-group-item list-group-item-action" data-pane="leaderboardControl"><i class="bi bi-bar-chart me-2"></i> Leaderboard Control</a>
                        <a class="list-group-item list-group-item-action" data-pane="supportControl"><i class="bi bi-headset me-2"></i> Support Control</a>
                    </div>
                </div>
            </div>
            <div class="p-2">
                <button class="btn btn-outline-danger w-100 btn-sm fw-bold py-2" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</button>
            </div>
        </div>

        <main class="main-content">
            <div class="row m-0 p-0">
                <div class="col-12 main-col-content p-0 m-0">
                    <div id="managementPane" class="w-100 h-100"></div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, get, set, push, remove, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyANjbQLKEpV0Mj5e5PJzCPZvFo8a5vzy_k",
            authDomain: "ff-tournamint-323ac.firebaseapp.com",
            databaseURL: "https://ff-tournamint-323ac-default-rtdb.firebaseio.com",
            projectId: "ff-tournamint-323ac",
            storageBucket: "ff-tournamint-323ac.firebasestorage.app",
            messagingSenderId: "157085748163",
            appId: "1:157085748163:web:848536d10ae58d32398b76"
        };
        const IMGBB_API_KEY = "52374940a6cadc3c3be0089b75399ec7";

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        const loader = document.getElementById('adminLoader');
        const showLoader = (val) => loader.style.display = val ? 'flex' : 'none';

        // Custom Confirm Modal Functions globally accessible
        window.showConfirmModal = function(title, text, callback) {
            document.getElementById("modalTitle").innerText = title;
            document.getElementById("modalText").innerText = text;
            const okBtn = document.getElementById("modalOkBtn");
            document.getElementById("customModal").style.display = "flex";
            
            okBtn.onclick = function() {
                window.closeModal();
                callback();
            };
        }

        window.closeModal = function() {
            document.getElementById("customModal").style.display = "none";
        }

        // Drawer Toggle Functionality
        const sidebarContainer = document.getElementById('sidebarContainer');
        const drawerToggleBtn = document.getElementById('drawerToggleBtn');
        const closeDrawerBtn = document.getElementById('closeDrawerBtn');

        drawerToggleBtn.addEventListener('click', () => {
            sidebarContainer.classList.toggle('open');
        });

        closeDrawerBtn.addEventListener('click', () => {
            sidebarContainer.classList.remove('open');
        });

        // Swipe/Drag gesture detection from left edge to open drawer
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, false);

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipeGesture();
        }, false);

        function handleSwipeGesture() {
            const swipeDistance = touchEndX - touchStartX;
            if (swipeDistance > 70 && touchStartX < 50) {
                sidebarContainer.classList.add('open');
            } else if (swipeDistance < -70 && sidebarContainer.classList.contains('open')) {
                sidebarContainer.classList.remove('open');
            }
        }

        // Secret Triple Tap Logic
        let tapCount = 0;
        let tapTimer = null;
        document.getElementById('secretTrigger').addEventListener('click', () => {
            tapCount++;
            clearTimeout(tapTimer);
            if (tapCount === 3) {
                tapCount = 0;
                const isSetupVisible = document.getElementById('admin-setup-section').style.display !== 'none';
                if (isSetupVisible) {
                    document.getElementById('setupEmail').value = "freezfreez5050@gmail.com";
                    document.getElementById('setupPassword').value = "awanbrand1212";
                } else {
                    document.getElementById('adminEmail').value = "freezfreez5050@gmail.com";
                    document.getElementById('adminPassword').value = "awanbrand1212";
                }
            } else {
                tapTimer = setTimeout(() => { tapCount = 0; }, 500);
            }
        });

        onAuthStateChanged(auth, async (user) => {
            showLoader(true);
            const configSnap = await get(ref(db, 'adminConfig'));
            const isSetupDone = configSnap.exists() && configSnap.val().setupComplete;

            if (user && isSetupDone && user.uid === configSnap.val().adminUid) {
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('admin-main-area').style.display = 'block';
                renderPane('manageSliders');
            } else {
                if(user) await signOut(auth); 
                document.getElementById('admin-main-area').style.display = 'none';
                document.getElementById('auth-container').style.display = 'flex';
                document.getElementById('admin-login-section').style.display = isSetupDone ? 'block' : 'none';
                document.getElementById('admin-setup-section').style.display = isSetupDone ? 'none' : 'block';
            }
            showLoader(false);
        });

        document.getElementById('controlMenu').addEventListener('click', (e) => {
            const target = e.target.closest('[data-pane]');
            if (!target) return;
            document.querySelectorAll('.control-menu a').forEach(el => el.classList.remove('active'));
            target.classList.add('active');
            renderPane(target.dataset.pane);
            
            // Auto close drawer when an option is clicked
            sidebarContainer.classList.remove('open');
        });

        async function renderPane(paneId) {
            const container = document.getElementById('managementPane');
            
            if (paneId === 'manageSliders') {
                container.innerHTML = `
                    <div class="p-4 overflow-y-auto" style="width: 1200px; height: 100vh; background-color: var(--bg-primary);">
                        <div class="card mb-4"><div class="card-body"><h4 class="card-title">Add New Slider</h4>
                        <form id="addSliderForm">
                            <div class="row">
                                <div class="col-md-6 mb-3"><label class="form-label fw-bold">Slider Image</label><input type="file" name="image" id="sliderImgInput" class="form-control" accept="image/*" required><div class="upload-status" id="uploadStatus"></div></div>
                                <div class="col-md-6 mb-3"><label class="form-label fw-bold">Redirect Link (URL)</label><input type="url" name="link" class="form-control" placeholder="https://example.com"></div>
                            </div>
                            <button type="submit" class="btn btn-primary px-4">Upload Slider</button>
                        </form></div></div>
                        <div class="card"><div class="card-body"><h4 class="card-title">Active Sliders</h4>
                        <div class="table-responsive"><table class="table">
                            <thead class="table-light"><tr><th>Preview</th><th>Link</th><th>Action</th></tr></thead>
                            <tbody id="sliderTableBody"></tbody>
                        </table></div></div></div>
                    </div>`;
                
                onValue(ref(db, 'promotions'), (snapshot) => {
                    const tbody = document.getElementById('sliderTableBody');
                    if (!tbody) return;
                    let html = '';
                    snapshot.forEach(child => {
                        const val = child.val();
                        html += `<tr><td><img src="${val.imageUrl}"></td><td><small class="text-secondary">${val.link || 'None'}</small></td><td><button class="btn btn-sm btn-outline-danger delete-btn" data-path="promotions/${child.key}"><i class="bi bi-trash"></i></button></td></tr>`;
                    });
                    tbody.innerHTML = html || '<tr><td colspan="3" class="text-center text-secondary">No Sliders</td></tr>';
                });
                attachSliderForm();

            } else if (paneId === 'referralsControl') {
                container.innerHTML = `<div class="iframe-container"><iframe src="referrals-admin.html"></iframe></div>`;

            } else if (paneId === 'leaderboardControl') {
                container.innerHTML = `<div class="iframe-container"><iframe src="admincontrol.html"></iframe></div>`;

            } else if (paneId === 'tournamentsControl') {
                container.innerHTML = `<div class="iframe-container"><iframe src="rooms.html"></iframe></div>`;

            } else if (paneId === 'walletControl') {
                container.innerHTML = `<div class="iframe-container"><iframe src="transaction.html"></iframe></div>`;

            } else if (paneId === 'supportControl') {
                container.innerHTML = `<div class="iframe-container"><iframe src="admin-chats.html"></iframe></div>`;

            } else if (paneId === 'usersControl') {
                container.innerHTML = `<div class="iframe-container"><iframe src="users.html"></iframe></div>`;

            } else {
                container.innerHTML = `<div class="p-5 text-center" style="width: 1200px;"><h4 class="text-white">${paneId}</h4><p class="text-secondary">Coming soon...</p></div>`;
            }
        }

        function attachSliderForm() {
            document.getElementById('addSliderForm')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const statusEl = document.getElementById('uploadStatus');
                const file = e.target.image.files[0];
                if (!file) return;

                showLoader(true);
                statusEl.textContent = 'Uploading...';
                try {
                    const fd = new FormData(); fd.append('image', file);
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: fd });
                    const json = await res.json();
                    if (json.success) {
                        await push(ref(db, 'promotions'), { imageUrl: json.data.url, link: e.target.link.value || "" });
                        e.target.reset();
                        statusEl.textContent = 'Success!';
                    }
                } catch (err) { alert(err.message); }
                finally { showLoader(false); }
            });
        }

        document.addEventListener('click', async (e) => {
            const btn = e.target.closest('.delete-btn');
            if (btn) {
                const path = btn.dataset.path;
                window.showConfirmModal("Delete Slider", "Kya aap is slider ko delete karna chahte hain?", async function() {
                    showLoader(true);
                    await remove(ref(db, path));
                    showLoader(false);
                });
            }
        });

        document.getElementById('adminLoginForm')?.addEventListener('submit', e => {
            e.preventDefault();
            signInWithEmailAndPassword(auth, e.target.adminEmail.value, e.target.adminPassword.value).catch(err => alert(err.message));
        });

        document.getElementById('adminSetupForm')?.addEventListener('submit', async e => {
            e.preventDefault();
            try {
                const cred = await createUserWithEmailAndPassword(auth, e.target.setupEmail.value, e.target.setupPassword.value);
                await set(ref(db, 'adminConfig'), { setupComplete: true, adminUid: cred.user.uid });
                location.reload();
            } catch (err) { alert(err.message); }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
    </script>
</body>
</html>
