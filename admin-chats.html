<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Admin Chats - FF GameZone PK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { background-color: #050a14; font-family: 'Arial', sans-serif; color: white; overflow-x: hidden; }
        .admin-header {
            background-color: #0d141f; padding: 15px; display: flex;
            justify-content: space-between; align-items: center;
            border-bottom: 2px solid #FFD700; position: sticky; top: 0; z-index: 100;
        }
        .admin-header h2 { color: #FFD700; font-size: 20px; }
        .header-icons { display: flex; gap: 20px; color: #8696a0; font-size: 18px; }
        .chat-list { display: flex; flex-direction: column; }
        .chat-item {
            display: flex; align-items: center; padding: 12px 15px;
            border-bottom: 1px solid #1a242f; cursor: pointer; transition: background 0.2s;
        }
        .chat-item:active { background-color: #1e2a33; }
        .user-avatar img {
            width: 55px; height: 55px; border-radius: 50%;
            object-fit: cover; border: 2px solid #FFD700; margin-right: 15px;
        }
        .chat-details { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .chat-top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
        .user-name { font-size: 16px; font-weight: bold; color: #ffffff; }
        .user-id-sub { font-size: 11px; color: #FFD700; display: block; margin-top: 1px; word-break: break-all; }
        .chat-time { font-size: 11px; color: #8696a0; white-space: nowrap; margin-left: 10px; }
        .chat-bottom-row { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
        .last-msg {
            font-size: 13px; color: #8696a0; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; max-width: 200px;
        }
        .unread-badge {
            background-color: #25d366; color: #000; font-size: 11px;
            font-weight: bold; min-width: 20px; height: 20px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .fab {
            position: fixed; bottom: 25px; right: 20px;
            background-color: #FFD700; width: 55px; height: 55px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6); color: black; font-size: 20px;
        }
        #loader { text-align: center; padding: 20px; color: #8696a0; }
    </style>
</head>
<body>

    <div class="admin-header">
        <h2>FF Support Admin</h2>
        <div class="header-icons">
            <i class="fas fa-search"></i>
            <i class="fas fa-ellipsis-v"></i>
        </div>
    </div>

    <div id="loader">Loading users...</div>
    <div class="chat-list" id="adminChatList"></div>

    <div class="fab">
        <i class="fas fa-comment-medical"></i>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyANjbQLKEpV0Mj5e5PJzCPZvFo8a5vzy_k",
            authDomain: "ff-tournamint-323ac.firebaseapp.com",
            databaseURL: "https://ff-tournamint-323ac-default-rtdb.firebaseio.com",
            projectId: "ff-tournamint-323ac",
            storageBucket: "ff-tournamint-323ac.firebasestorage.app",
            messagingSenderId: "157085748163",
            appId: "1:157085748163:web:848536d10ae58d32398b76"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        function refreshChatList() {
            const chatListContainer = document.getElementById('adminChatList');
            const loader = document.getElementById('loader');
            const usersRef = ref(db, 'users');

            onValue(usersRef, (snapshot) => {
                loader.style.display = 'none';
                if (!snapshot.exists()) {
                    chatListContainer.innerHTML = `<div style="text-align:center; margin-top:50px; color:#8696a0;"><p>No users found.</p></div>`;
                    return;
                }

                const usersData = snapshot.val();
                
                // Sorting: Newest messages first
                const userArray = Object.keys(usersData).map(uid => ({
                    uid: uid,
                    ...usersData[uid]
                })).sort((a, b) => (b.lastTimestamp || 0) - (a.lastTimestamp || 0));

                chatListContainer.innerHTML = "";
                
                userArray.forEach(user => {
                    const uid = user.uid;
                    
                    // Fetch profile details matching what users set in their profile
                    const displayName = user.userName || user.name || user.displayName || user.username || "Unknown Gamer";
                    const contactInfo = user.userEmail || user.email || user.phone || uid; 
                    const profileImg = user.profilePic || user.photo || user.profile_pic || 'https://i.ibb.co/S4k4TFTG/1777131751749.png';
                    
                    const unreadCount = user.unreadCount || 0;
                    const lastMsg = user.lastMessage || "No messages yet";
                    
                    let timeShow = "";
                    if(user.lastTimestamp) {
                        const date = new Date(user.lastTimestamp);
                        timeShow = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    }

                    const chatHtml = `
                        <div class="chat-item" onclick="openUserChat('${uid}', '${encodeURIComponent(displayName)}')">
                            <div class="user-avatar">
                                <img src="${profileImg}" alt="Profile">
                            </div>
                            <div class="chat-details">
                                <div class="chat-top-row">
                                    <div style="max-width: 75%;">
                                        <span class="user-name">${displayName}</span>
                                        <span class="user-id-sub">${contactInfo}</span>
                                    </div>
                                    <span class="chat-time">${timeShow}</span>
                                </div>
                                <div class="chat-bottom-row">
                                    <span class="last-msg">${lastMsg}</span>
                                    ${unreadCount > 0 ? `<span class="unread-badge">${unreadCount}</span>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                    chatListContainer.innerHTML += chatHtml;
                });
            });
        }

        // Open specific user chat as admin with their exact ID and name
        window.openUserChat = async function(userId, encodedUserName) {
            const userName = decodeURIComponent(encodedUserName);
            // Clear unread count for this user upon clicking
            await update(ref(db, 'users/' + userId), { unreadCount: 0 });
            
            // Redirect to support chat page with correct admin routing context
            window.location.href = `support.html?uid=${encodeURIComponent(userId)}&name=${encodeURIComponent(userName)}&mode=admin`;
        };

        refreshChatList();
    </script>
</body>
</html>
