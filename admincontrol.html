<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1024">
    <title>Admin - Leaderboard Control</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #0F0C29; color: white; font-family: sans-serif; text-align: center; padding: 20px; margin: 0; min-width: 1024px; }
        .box { background: #1A1A3C; padding: 20px; border-radius: 15px; margin-top: 20px; border: 1px solid #FF4C60; box-shadow: 0 0 20px rgba(255, 76, 96, 0.2); }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #0F0C29; color: white; text-align: center; font-size: 15px; outline: none; }
        input:focus { border-color: #FF4C60; }
        
        .custom-select-btn { width: 100%; padding: 15px; background: #25254d; border: 1px dashed #FF4C60; border-radius: 10px; color: #FF4C60; font-weight: bold; cursor: pointer; margin: 10px 0; display: flex; align-items: center; justify-content: center; gap: 10px; }

        button.update-btn { background: #FF4C60; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; text-transform: uppercase; }
        
        .preview-img { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #FF4C60; margin-top: 10px; object-fit: cover; }
        
        /* MODAL STYLING */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1A1A3C; width: 90%; max-width: 400px; height: 70vh; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid #333; }
        .modal-header { padding: 15px; background: #25254d; font-weight: bold; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
        .user-list-scroll { flex: 1; overflow-y: auto; padding: 10px; }
        
        .user-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #222; cursor: pointer; }
        .user-item img { width: 50px; height: 50px; border-radius: 50%; margin-right: 15px; border: 1px solid #444; object-fit: cover; }
        .user-details { text-align: left; }
        .user-name { display: block; font-weight: bold; font-size: 14px; color: #fff; }
        .user-email { display: block; font-size: 11px; color: #aaa; }

        /* Leaderboard List */
        .admin-list { margin-top: 30px; text-align: left; background: #1A1A3C; padding: 15px; border-radius: 15px; border: 1px solid #3498db; }
        .player-item { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #333; padding: 10px 0; }
        .player-info { display: flex; align-items: center; flex: 1; }
        .player-item img { width: 45px; height: 45px; border-radius: 50%; margin-right: 12px; border: 1px solid #FF4C60; object-fit: cover; }
        .rank-tag { background: #FF4C60; width: 30px; text-align: center; padding: 4px 0; border-radius: 5px; font-size: 12px; margin-right: 10px; font-weight: bold; }
        .del-btn { background: #ff3333; color: white; border: none; padding: 6px 12px; border-radius: 5px; font-size: 11px; cursor: pointer; }

        /* CUSTOM CONFIRM MODAL */
        #customModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .custom-modal-content {
            background: #181818;
            padding: 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 320px;
            border: 1px solid #444;
            text-align: center;
        }
        .custom-modal-content h3 { margin-top: 0; color: #fff; font-size: 1.2rem; }
        .custom-modal-content p { color: #ccc; font-size: 14px; margin: 15px 0; }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .modal-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-cancel { background: #333; color: #fff; }
        .btn-danger { background: #e74c3c; color: #fff; }
    </style>
</head>
<body>

    <h2>Leaderboard Admin</h2>
    
    <div class="box">
        <p style="margin:0; font-size: 12px; color: #FF4C60;">Step 1: Rank Number</p>
        <input type="number" id="rank-num" placeholder="Rank (1-15)">
        
        <p style="margin:5px 0 0 0; font-size: 12px; color: #FF4C60;">Step 2: Select Player</p>
        <div class="custom-select-btn" onclick="openUserModal()">
            <i class="bi bi-person-badge"></i> CLICK TO SELECT USER
        </div>

        <img id="char-preview" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="preview-img">
        
        <p style="margin:10px 0 0 0; font-size: 12px; color: #aaa;">Player Name:</p>
        <input type="text" id="p-name" placeholder="Enter or Edit Name">
        
        <div style="display: flex; gap: 10px; width: 95%; margin: 0 auto;">
            <div style="flex: 1;">
                <p style="margin:5px 0 0 0; font-size: 12px; color: #aaa;">Kills:</p>
                <input type="number" id="p-kills" placeholder="Kills" style="width: 100%;">
            </div>
            <div style="flex: 1;">
                <p style="margin:5px 0 0 0; font-size: 12px; color: #aaa;">Points:</p>
                <input type="number" id="p-points" placeholder="Points" style="width: 100%;">
            </div>
        </div>
        
        <button class="update-btn" onclick="updateLeaderboard()">Update Leaderboard</button>
    </div>

    <div class="modal-overlay" id="userModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Select User from App</span>
                <i class="bi bi-x-lg" onclick="closeUserModal()" style="cursor:pointer;"></i>
            </div>
            <div class="user-list-scroll" id="modal-user-list"></div>
        </div>
    </div>

    <!-- CUSTOM CONFIRM MODAL -->
    <div id="customModal">
        <div class="custom-modal-content">
            <h3 id="modalTitle">Confirmation</h3>
            <p id="modalText">Are you sure?</p>
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" onclick="closeConfirmModal()">Cancel</button>
                <button class="modal-btn btn-danger" id="modalOkBtn">Delete</button>
            </div>
        </div>
    </div>

    <div class="admin-list">
        <h3>Current Rankings (1-15)</h3>
        <div id="player-container"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyANjbQLKEpV0Mj5e5PJzCPZvFo8a5vzy_k",
            authDomain: "ff-tournamint-323ac.firebaseapp.com",
            databaseURL: "https://ff-tournamint-323ac-default-rtdb.firebaseio.com",
            projectId: "ff-tournamint-323ac",
            storageBucket: "ff-tournamint-323ac.firebasestorage.app",
            appId: "1:157085748163:web:848536d10ae58d32398b76"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function openUserModal() {
            document.getElementById('userModal').style.display = 'flex';
            loadUsersToModal();
        }

        function closeUserModal() {
            document.getElementById('userModal').style.display = 'none';
        }

        function showConfirm(title, text, callback) {
            document.getElementById("modalTitle").innerText = title;
            document.getElementById("modalText").innerText = text;
            const okBtn = document.getElementById("modalOkBtn");
            document.getElementById("customModal").style.display = "flex";
            
            okBtn.onclick = function() {
                closeConfirmModal();
                callback();
            };
        }

        function closeConfirmModal() {
            document.getElementById("customModal").style.display = "none";
        }

        function loadUsersToModal() {
            const listContainer = document.getElementById('modal-user-list');
            listContainer.innerHTML = "<p style='text-align:center; padding:20px;'>Fetching Users...</p>";
            
            database.ref('users').once('value', (snapshot) => {
                listContainer.innerHTML = "";
                snapshot.forEach((child) => {
                    const user = child.val();
                    const name = user.displayName || "No Name";
                    const email = user.email || "No Email";
                    const photo = user.profilePic || "https://cdn-icons-png.flaticon.com/512/149/149071.png";

                    const item = document.createElement('div');
                    item.className = "user-item";
                    item.onclick = () => {
                        document.getElementById('p-name').value = name;
                        document.getElementById('char-preview').src = photo;
                        closeUserModal();
                    };
                    item.innerHTML = `
                        <img src="${photo}">
                        <div class="user-details">
                            <span class="user-name">${name}</span>
                            <span class="user-email">${email}</span>
                        </div>
                    `;
                    listContainer.appendChild(item);
                });
            });
        }

        function updateLeaderboard() {
            const rank = document.getElementById('rank-num').value;
            const name = document.getElementById('p-name').value;
            const photo = document.getElementById('char-preview').src;
            const kills = document.getElementById('p-kills').value;
            const points = document.getElementById('p-points').value;

            if(!rank || !name || !kills || !points) return alert("Pehle sab kuch fill karein!");

            database.ref('Leaderboard/' + rank).set({
                name: name, 
                photo: photo, 
                kills: kills, 
                points: points, 
                rank: parseInt(rank)
            }).then(() => {
                alert("Rank " + rank + " Updated!");
                document.getElementById('p-kills').value = "";
                document.getElementById('p-points').value = "";
            });
        }

        database.ref('Leaderboard').on('value', (snapshot) => {
            const container = document.getElementById('player-container');
            container.innerHTML = "";
            
            let players = [];
            snapshot.forEach((child) => {
                players.push(child.val());
            });

            players.sort((a, b) => a.rank - b.rank);

            players.forEach((data) => {
                container.innerHTML += `
                    <div class="player-item">
                        <div class="player-info">
                            <span class="rank-tag">${data.rank}</span>
                            <img src="${data.photo}">
                            <div>
                                <strong>${data.name}</strong><br>
                                <small style="color:#4ed1ff">Kills: ${data.kills} | Points: ${data.points}</small>
                            </div>
                        </div>
                        <button class="del-btn" onclick="deletePlayer('${data.rank}')">DEL</button>
                    </div>
                `;
            });
        });

        function deletePlayer(id) {
            showConfirm("Delete Player", "Rank " + id + " ko remove karein?", function() {
                database.ref('Leaderboard/' + id).remove().then(() => alert("Player Removed!"));
            });
        }
    </script>
</body>
</html>
